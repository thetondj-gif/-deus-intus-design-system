name: Deus Intus website preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deus-intus-website-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated website artifact
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-5194-81f4-a163-ed7031bd8352/raw?se=2026-07-26T12:30:59Z&sp=r&sv=2026-02-06&sr=b&scid=1a78e073-532e-5eb3-a5ce-9804571f04cd&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-26T08:03:39Z&ske=2026-07-28T08:03:39Z&sks=b&skv=2026-02-06&sig=x9K7bhUjz9CdnC44wjFPunP%2BVlE/XIxOIhkpc/eh3iI%3D"
        run: |
          rm -rf /tmp/deus-intus-site
          mkdir -p /tmp/deus-intus-site
          curl --fail --location --retry 3 --output /tmp/deus-intus-site.zip "$ARTIFACT_URL"
          unzip -q /tmp/deus-intus-site.zip -d /tmp/deus-intus-site
          test -f /tmp/deus-intus-site/index.html

      - name: Adapt links for static CDN hosting
        env:
          PREVIEW_BASE: https://raw.githack.com/thetondj-gif/-deus-intus-design-system/website-preview-site
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path('/tmp/deus-intus-site')
          base = os.environ['PREVIEW_BASE'].rstrip('/')
          suffixes = {'.html', '.css', '.js', '.json', '.webmanifest'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              text = re.sub(
                  r'(?P<q>["\'`])/(?!/)',
                  lambda match: match.group('q') + base + '/',
                  text,
              )
              text = re.sub(
                  r'url\((?P<q>["\']?)/(?!/)',
                  lambda match: 'url(' + match.group('q') + base + '/',
                  text,
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify compiled preview
        run: |
          test -s /tmp/deus-intus-site/index.html
          test -s /tmp/deus-intus-site/assets/css/site.css
          test -s /tmp/deus-intus-site/assets/js/site.js
          grep -q 'raw.githack.com/thetondj-gif/-deus-intus-design-system/website-preview-site/assets/css/site.css' /tmp/deus-intus-site/index.html

      - name: Publish isolated preview branch
        run: |
          git config user.name "Deus Intus Preview Bot"
          git config user.email "preview@deusintus.com"
          git switch --orphan website-preview-site
          git rm -rf . || true
          cp -a /tmp/deus-intus-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish validated Deus Intus website preview"
          git push --force origin HEAD:website-preview-site
