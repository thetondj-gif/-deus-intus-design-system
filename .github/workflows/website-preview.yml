name: Deus Intus website preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deus-intus-website-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated website artifact
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-154c-81f4-97f9-5fc0d8be9b38/raw?se=2026-07-26T13:42:29Z&sp=r&sv=2026-02-06&sr=b&scid=2f871ee7-491f-52e6-abcd-3a866776bdd5&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-26T09:42:26Z&ske=2026-07-28T09:42:26Z&sks=b&skv=2026-02-06&sig=2dHus99yU6FtbpGdQWsf8kT0i1%2BwqoXg8QCjY%2BTnK7E%3D"
        run: |
          rm -rf /tmp/deus-intus-site
          mkdir -p /tmp/deus-intus-site
          curl --fail --location --retry 3 --output /tmp/deus-intus-site.zip "$ARTIFACT_URL"
          unzip -q /tmp/deus-intus-site.zip -d /tmp/deus-intus-site
          test -f /tmp/deus-intus-site/index.html

      - name: Remove non-public implementation material
        run: |
          rm -rf \
            /tmp/deus-intus-site/.git \
            /tmp/deus-intus-site/.github \
            /tmp/deus-intus-site/content \
            /tmp/deus-intus-site/docs \
            /tmp/deus-intus-site/functions \
            /tmp/deus-intus-site/scripts \
            /tmp/deus-intus-site/source \
            /tmp/deus-intus-site/work
          find /tmp/deus-intus-site -type f \( \
            -iname '*.md' -o \
            -iname '*.toml' -o \
            -iname '*.env' -o \
            -iname '*.env.*' -o \
            -iname '*.py' -o \
            -iname '*.zip' \
          \) -delete
          rm -f /tmp/deus-intus-site/_headers /tmp/deus-intus-site/_routes.json
          test ! -e /tmp/deus-intus-site/implementation-notes.md
          test ! -d /tmp/deus-intus-site/functions

      - name: Adapt links for static CDN hosting
        env:
          PREVIEW_BASE: https://raw.githack.com/thetondj-gif/-deus-intus-design-system/website-preview-site
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path('/tmp/deus-intus-site')
          base = os.environ['PREVIEW_BASE'].rstrip('/')
          suffixes = {'.html', '.css', '.js', '.json', '.webmanifest'}

          opening_path = re.compile(r'(?P<prefix>[=(:,\[\s])(?P<q>["\'])/(?!/)')
          css_path = re.compile(r'url\((?P<q>["\']?)/(?!/)')
          srcset = re.compile(r'(?P<prefix>\bsrcset\s*=\s*)(?P<q>["\'])(?P<value>.*?)(?P=q)', re.I | re.S)

          def rewrite_srcset(match: re.Match[str]) -> str:
              value = re.sub(r'(^|,\s*)/(?!/)', lambda item: item.group(1) + base + '/', match.group('value'))
              return match.group('prefix') + match.group('q') + value + match.group('q')

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              text = srcset.sub(rewrite_srcset, text)
              text = opening_path.sub(
                  lambda match: match.group('prefix') + match.group('q') + base + '/',
                  text,
              )
              text = css_path.sub(
                  lambda match: 'url(' + match.group('q') + base + '/',
                  text,
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify compiled preview
        run: |
          test -s /tmp/deus-intus-site/index.html
          test -s /tmp/deus-intus-site/assets/css/site.css
          test -s /tmp/deus-intus-site/assets/js/site.js
          grep -q 'raw.githack.com/thetondj-gif/-deus-intus-design-system/website-preview-site/assets/css/site.css' /tmp/deus-intus-site/index.html
          ! grep -R -nE 'd="[^"]*"https://raw\.githack' /tmp/deus-intus-site --include='*.html'
          ! find /tmp/deus-intus-site -type f \( -iname '*.md' -o -iname '*.toml' -o -iname '*.env*' -o -iname '*.py' -o -iname '*.zip' \) -print -quit | grep -q .

      - name: Publish isolated preview branch
        run: |
          git config user.name "Deus Intus Preview Bot"
          git config user.email "preview@deusintus.com"
          git switch --orphan website-preview-site
          git rm -rf . || true
          cp -a /tmp/deus-intus-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish sanitised Deus Intus website preview"
          git push --force origin HEAD:website-preview-site
